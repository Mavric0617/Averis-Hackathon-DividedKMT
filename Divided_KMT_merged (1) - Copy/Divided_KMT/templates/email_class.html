<!--script for inbox-->
<script>
// Master array to hold parsed email variables from email_module2.py
let emailDataset = [];
let activeTab = "comparison";

// Kick off backend fetch routine as soon as template renders
window.onload = function() {
    fetchLiveClassifiedEmails();
};

// Requests parsed dataset from python web app pipeline
function fetchLiveClassifiedEmails() {
    const listContainer = document.getElementById('email-tiles-list');
    if (listContainer) {
        listContainer.innerHTML = `<div style="color:#00d2ff; text-align:center; padding-top:20px;">Running email_module2.py pipeline...</div>`;
    }
    
    fetch('/api/classified-emails')
        .then(response => {
            if (!response.ok) throw new Error("Backend processing failed");
            return response.json();
        })
        .then(data => {
            emailDataset = data; 
            updateBadgeCounts(); 
            switchTab(activeTab); 
        })
        .catch(error => {
            console.error("Error linking with email_module2.py:", error);
            if (listContainer) {
                listContainer.innerHTML = `<div style="color:#ff4a4a; text-align:center; padding-top:20px;">
                    <strong>Frontend Fetch Catch:</strong><br>${error.message}
                </div>`;
            }
        });
}

// Recalculates dashboard total badges across categorized streams
function updateBadgeCounts() {
    document.getElementById('count-comp').textContent = emailDataset.filter(e => e.category === 'comparison').length;
    document.getElementById('count-si').textContent = emailDataset.filter(e => e.category === 'new-si').length;
    document.getElementById('count-inv').textContent = emailDataset.filter(e => e.category === 'invoice').length;
    document.getElementById('count-gen').textContent = emailDataset.filter(e => e.category === 'general').length;
    document.getElementById('count-spam').textContent = emailDataset.filter(e => e.category === 'spam').length;
}

// Toggles active selection layout tabs and resets view states
function switchTab(category) {
    activeTab = category;
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(category)) {
            btn.classList.add('active');
        }
    });

    renderTiles();
    
    const detailPane = document.getElementById('email-detail-pane');
    if (detailPane) {
        detailPane.className = "detail-column empty-state";
        detailPane.innerHTML = `<div class="placeholder-text">Select an email from the list to view its contents</div>`;
    }
}

// Renders the email summary tiles in the workspace stack
function renderTiles() {
    const listContainer = document.getElementById('email-tiles-list');
    if (!listContainer) return;
    listContainer.innerHTML = "";
    
    const filteredEmails = emailDataset.filter(e => e.category === activeTab);
    
    if(filteredEmails.length === 0) {
        listContainer.innerHTML = `<div style="color:#888; text-align:center; padding-top:20px;">No emails in this category.</div>`;
        return;
    }

    filteredEmails.forEach(email => {
        const tile = document.createElement('div');
        tile.className = 'email-tile';
        tile.id = 'tile-' + email.id;
        tile.onclick = function() { selectEmail(email.id); };
        
        tile.innerHTML = `
            <div class="tile-header">
                <span>` + email.sender + `</span>
                <span>` + email.date + `</span>
            </div>
            <div class="tile-subject">` + email.subject + `</div>
            <div class="tile-snippet">` + email.body + `</div>
        `;
        listContainer.appendChild(tile);
    });
}

// Opens the reading pane to display full text contents and badges
function selectEmail(id) {
    document.querySelectorAll('.email-tile').forEach(t => t.classList.remove('selected'));
    
    const selectedTile = document.getElementById('tile-' + id);
    if(selectedTile) selectedTile.classList.add('selected');

    const email = emailDataset.find(e => e.id === id);
    const detailPane = document.getElementById('email-detail-pane');
    if (!detailPane || !email) return;
    
    detailPane.className = "detail-column";
    
    let attachmentsHTML = "";
    if(email.attachments && email.attachments.length > 0) {
        attachmentsHTML = `<div class="attachments-section">
            <div style="font-size:0.9rem; color:#aaa; margin-bottom:8px;">📎 Attachments:</div>`;
        
        email.attachments.forEach(name => {
            attachmentsHTML += `<span class="attachment-badge">📄 ` + name + `</span>`;
        });
        
        attachmentsHTML += `</div>`;
    }

    detailPane.innerHTML = `
        <div class="email-view-header">
            <h2 class="email-view-subject">` + email.subject + `</h2>
            <div class="email-view-meta">
                <div><strong>From:</strong> ` + email.sender + `</div>
                <div><strong>Date:</strong> ` + email.date + `</div>
            </div>
        </div>
        <div class="email-view-body">` + email.body + `</div>
        ` + attachmentsHTML + `
    `;
}

</script>

<!--script for AI helper-->
<script>
    // Toggles the visibility of the UI chat pop-up container
function toggleAIChat() {
  const chatContainer = document.getElementById('ai-chat-container');
  chatContainer.classList.toggle('hidden');
  
  // Auto-scroll window to bottom when opened
  if (!chatContainer.classList.contains('hidden')) {
    const messageBody = document.getElementById('ai-chat-messages');
    messageBody.scrollTop = messageBody.scrollHeight;
  }
}

// Appends user text messages dynamically to the UI log
function sendAIMessage() {
  const inputEl = document.getElementById('ai-user-input');
  const text = inputEl.value.trim();

  if (!text) return;

  const messageBody = document.getElementById('ai-chat-messages');

  // Create User Message Element
  const userDiv = document.createElement('div');
  userDiv.className = 'message user-msg';
  userDiv.textContent = text;
  messageBody.appendChild(userDiv);

  // Clear Input Box
  inputEl.value = '';

  // Smooth scroll down to view new message
  messageBody.scrollTop = messageBody.scrollHeight;

    // Word-boundary so it doesn't fire on words like "consume" or "assumption".
  const triggerRegex = /\b(summary|summarize|sum|review)\b/i;
    const fieldQueryRegex = /\b(port\s+of\s+loading|loading\s+port|pol|pl|port\s+of\s+discharge|discharge\s+port|pod|gross\s+weight|gross\s+wt|weight|kg|gw|container\s+count|containers|cc|shipper|consignee|notify\s+party|notify)\b/i;
    if (!triggerRegex.test(text) || fieldQueryRegex.test(text)) {
        appendSystemMessage(getDataReply(text));
    return;
  }

  const loadingEl = appendSystemMessage('Generating your inbox summary…');

  fetch('/api/summary')
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      loadingEl.remove();
      if (!ok) {
        appendSystemMessage('⚠️ ' + (data.error || "Couldn't generate a summary."));
        return;
      }
      appendSummaryMessage(data.summary);
    })
    .catch(err => {
      loadingEl.remove();
      appendSystemMessage('⚠️ Network error: ' + err.message);
    });
}

function getDataReply(text) {
    const query = text.toLowerCase();
    const fieldAliases = [
        { name: 'Port of Loading', aliases: ['port of loading', 'loading port', 'pol', 'pl'] },
        { name: 'Port of Discharge', aliases: ['port of discharge', 'discharge port', 'pod'] },
        { name: 'Gross Weight (kg)', aliases: ['gross weight', 'gross wt', 'weight', 'kg', 'gw'] },
        { name: 'Container Count', aliases: ['container count', 'containers', 'container number', 'cc'] },
        { name: 'Shipper', aliases: ['shipper'] },
        { name: 'Consignee', aliases: ['consignee'] },
        { name: 'Notify Party', aliases: ['notify party', 'notify'] }
    ];
    const requestedField = fieldAliases.find(field =>
        field.aliases.some(alias => new RegExp(`\\b${alias.replace(/ /g, '\\s+')}\\b`, 'i').test(query))
    );

    if (!requestedField) return getConversationalReply(text);

    const answers = [];
    emailDataset.forEach(email => {
        const fields = email.fields || {};
        const siValue = fields.SI && fields.SI[requestedField.name];
        const blValue = fields.BL && fields.BL[requestedField.name];
        if (siValue || blValue) {
            answers.push(`${email.subject}: SI ${siValue || 'not available'}; BL ${blValue || 'not available'}`);
        }
    });

    if (!answers.length) {
        return `I couldn't find a recorded ${requestedField.name.toLowerCase()} in the loaded shipment documents.`;
    }
    return `Here is the ${requestedField.name} I found:\n\n${answers.join('\n')}`;
}

function getConversationalReply(text) {
    const message = text.toLowerCase();

    if (/\b(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(message)) {
        return 'Hi! What would you like to check in the inbox today?';
    }
    if (/\b(thanks|thank you|thx)\b/.test(message)) {
        return 'You’re welcome. I’m here whenever you need another look at the inbox.';
    }
    if (/\b(how are you|how is it going)\b/.test(message)) {
        return 'I’m doing well and ready to help you review the inbox.';
    }
    if (/\b(help|what can you do|what do you do)\b/.test(message)) {
        return 'I can generate an inbox summary, help you review shipment messages, and point you toward the manual review workflow. Try “summary” when you want the full report.';
    }
    if (/\b(bye|goodbye|see you)\b/.test(message)) {
        return 'See you later. I’ll be here when you need to check the inbox again.';
    }
    return 'I’m listening. You can ask for a summary, or tell me what you’re trying to find in the inbox.';
}

// Adds a plain system text bubble, returns the element so callers can
// remove it later (used for the "Generating…" loading message).
function appendSystemMessage(text) {
  const messageBody = document.getElementById('ai-chat-messages');
  const div = document.createElement('div');
  div.className = 'message system-msg';
  div.textContent = text;
  messageBody.appendChild(div);
  messageBody.scrollTop = messageBody.scrollHeight;
  return div;
}

// Adds the AI-generated summary as a bubble, with Print + Download PDF
// buttons underneath it.
function appendSummaryMessage(summaryText) {
  const messageBody = document.getElementById('ai-chat-messages');

  const wrapper = document.createElement('div');
  wrapper.className = 'message system-msg';

  const textDiv = document.createElement('div');
  textDiv.style.whiteSpace = 'pre-wrap';
  textDiv.textContent = summaryText;
  wrapper.appendChild(textDiv);

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'margin-top:10px; display:flex; gap:8px;';

  const printBtn = document.createElement('button');
  printBtn.textContent = '🖨 Print';
  printBtn.style.cssText = 'padding:6px 12px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:transparent; color:white; cursor:pointer; font-size:12px;';
  printBtn.onclick = () => printSummary(summaryText);
  btnRow.appendChild(printBtn);

  const pdfBtn = document.createElement('button');
  pdfBtn.textContent = '⬇ Download PDF';
  pdfBtn.style.cssText = 'padding:6px 12px; border-radius:6px; border:none; background:#00d2ff; color:black; font-weight:bold; cursor:pointer; font-size:12px;';
  pdfBtn.onclick = () => downloadSummaryPDF(pdfBtn);
  btnRow.appendChild(pdfBtn);

  wrapper.appendChild(btnRow);
  messageBody.appendChild(wrapper);
  messageBody.scrollTop = messageBody.scrollHeight;
}

// Opens the browser's native print dialog (which can "Save as PDF") with
// just the summary text, formatted for print.
function printSummary(summaryText) {
  const win = window.open('', '_blank');
  const safeText = summaryText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  win.document.write(
    '<html><head><title>Email Summary Report</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:40px;white-space:pre-wrap;line-height:1.6;}' +
    'h1{font-size:20px;}</style></head><body>' +
    '<h1>Email Summary Report</h1><div>' + safeText + '</div></body></html>'
  );
  win.document.close();
  win.focus();
  win.print();
}

// Downloads a server-generated PDF report (summary + full source email list).
function downloadSummaryPDF(btn) {
  const originalText = btn.textContent;
  btn.textContent = 'Generating…';
  btn.disabled = true;

  fetch('/api/summary/pdf')
    .then(res => {
      if (!res.ok) return res.json().then(data => { throw new Error(data.error || 'Failed to generate PDF'); });
      return res.blob();
    })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'email-summary-report.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    })
    .catch(err => alert('PDF generation failed: ' + err.message))
    .finally(() => {
      btn.textContent = originalText;
      btn.disabled = false;
    });
}

</script>

<script>
    function verifySession() {
        const sessionUser = localStorage.getItem('currentSessionUser');
        if (!sessionUser) {
            window.location.href = 'login.html';
            return;
        }

        const users = JSON.parse(localStorage.getItem('users')) || [];
        const match = users.find(u => u.username.toLowerCase() === sessionUser.toLowerCase());

        if (!match) {
            alert('Your active account session has been dissolved by the Admin.');
            localStorage.removeItem('currentSessionUser');
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('p-user').textContent = match.username;
        document.getElementById('p-email').textContent = match.email;
        document.getElementById('greet').textContent = `Welcome, ${match.username}!`;
        document.getElementById('avatar').textContent = match.username.charAt(0).toUpperCase();
    }

    function goToEditPage() {
        window.location.href = 'edit.html';
    }

    function logout() {
        localStorage.removeItem('currentSessionUser');
        window.location.href = 'login.html';
    }

    verifySession();
    setInterval(verifySession, 2000); 
</script>
