<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DKMT</title>
<link rel="icon" type="image/x-icon" href="img/ett.ico">
<style>
* {box-sizing: border-box}
body {font-family: Verdana, sans-serif; margin:0;background-color: black;}
.mySlides {display: none}
img {
  vertical-align: middle;
}

/* Slideshow container */
.slideshow-container {
  width: 100%;
  height:100vh;
  position: relative;
  margin: auto;
}

.slideshow-container img {
  width: 100%;
  height: 70%;
  object-fit: cover;
}

/* Next & previous buttons */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
}

/* Position the "next button" to the right */
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* On hover, add a black background color with a little bit see-through */
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}

/* Caption text */
.text {
  color: #f2f2f2;
  text-shadow: 5px 5px 10px rgba(0,0,0,0.5);
  font-size: 18vb;
  font-weight: bold;
  font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
  position: absolute;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  width: 100%;
  text-align: center;
}

.numbertext {
  color: #f2f2f2;
  font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
  font-size: 10dvb;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

/* The dots/bullets/indicators */
.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}

/* Fading animation */
.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

.dot-container {
  position: absolute;
  bottom: 15px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

.explore-btn {
    z-index: 4;
    position: absolute;
    /* Prevents the button from climbing too high on small screens */
    bottom: max(100px, calc(30% - 5dvb)); 
    /* Centers the button safely */
    left: calc(50% - max(40px, 10dvb)); 
    /* Prevents the button from becoming a tiny square */
    width: max(140px, 20dvb); 
    text-align: center;
    /* Sets a minimum readable padding for the button height */
    padding: max(10px, 3dvb) 0; 
    border: solid 2px white;
    border-radius: 3vb;
    background: rgba(0,0,0,0.5);
    font-size: 2.5vb;
    color: white;
    transition: background-color 0.3s;
    cursor: pointer;
    &:hover {
      color: black;
      background: white;
    }
  }

/* On smaller screens, decrease text size */
@media only screen and (max-width: 700px) {
  .prev, .next {font-size: 11px}
  .explore-btn {
    bottom: 10% !important; /* Forces it to the very bottom edge */
    font-size: 12px !important; /* Shrinks the text size slightly to save room */
    padding: 3vb 0 !important; /* Shrinks the button height */
    left: calc(50% - max(50px, 15dvb))!important;
  }
}

</style>
</head>
<body>

<div class="slideshow-container">

<img src="img/tang.png" style="width:auto; height:12vh; position:absolute; margin-top: 5vh; margin-left: 5vh;z-index: 5;animation:none !important;">
<div class="numbertext" style="padding-left: 15vh; line-height: 10vh; margin-top: 5vh; margin-left: 10vh;z-index: 5;animation:none !important">DKMT</div>

<div class="mySlides fade">
  <img src="img/1.webp" style="width:100%;height: 100vh;">
  <div class="text fade">Employee's Panel</div>
</div>

<div class="mySlides fade">
  <img src="img/c2.png" style="width:100%;height:100vh;filter: brightness(0.5);">
  <div class="text fade">Shipping Company</div>
</div>

<div class="mySlides fade">
  <img src="img/c3.png" style="width:100%;height:100vh;filter: brightness(0.5);">
  <div class="text fade">Strive for a Raise!</div>
</div>

<a class="prev" onclick="plusSlides(-1)">❮</a>
<a class="next" onclick="plusSlides(1)">❯</a>

<a href="login.html"><div class="explore-btn">Log In</div></a>

<br>

<div class="dot-container">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
</div>

</div>

<script>
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}
</script>

</body>
</html>
